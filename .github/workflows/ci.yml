name: FluxPay Production CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly deep test & vulnerability scan
    - cron: '0 0 * * 0'  # Weekly dependency audit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Hygiene & Type Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff Lint & Format Verification
        run: uv run ruff check src tests && uv run ruff format --check src tests

      - name: Mypy Strict Static Type Analysis
        run: uv run mypy

  unit-and-integration-tests:
    name: Invariant & Regression Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLX_ENV: development
      FLX_PG_DSN: postgresql://test:testpassword@localhost:5432/test
      FLX_VALKEY_URL: redis://localhost:6379/0
      FLX_RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      FLX_VAULT_MASTER_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      FLX_WEBHOOK_SIGNING_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply DB Migrations
        run: uv run python scripts/migrate.py

      - name: Execute Pytest Suite with Coverage
        run: uv run pytest --cov=fluxpay --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker-build-and-scan:
    name: Multi-Stage Container Build & Security Scan
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fluxpay-api:${{ github.sha }}
          load: true

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fluxpay-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to Staging (Base Sepolia)
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Trigger Staging Deploy
        run: echo "Deploying commit ${{ github.sha }} to staging on Base Sepolia..."

  deploy-production:
    name: Deploy to Production (Base Mainnet)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://console.fluxpay.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Trigger Production Rolling Deploy
        run: echo "Deploying tag ${{ github.ref_name }} to production on Base L2 Mainnet..."
