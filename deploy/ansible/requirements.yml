# ==============================================================================
# FluxPay Ansible Dependencies Contract (Task 67)
# Requires: ansible-core >= 2.17.0 (Control-node execution environment)
# Install collections via: ansible-galaxy collection install -r requirements.yml
# ==============================================================================
collections:
  # POSIX modules for kernel sysctl and authorized_key management
  - name: ansible.posix
    version: "2.0.0"

  # UFW firewall and basic Linux system administrative modules
  - name: community.general
    version: "10.4.0"

  # PostgreSQL audited modules: database, user role, and schema manipulation
  - name: community.postgresql
    version: "3.5.1"
