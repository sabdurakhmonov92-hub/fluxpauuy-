# ==============================================================================
# FLUXPAY NGINX EDGE CONFIGURATION (TASK 65)
# Native Unix Domain Socket (UDS) reverse proxy with blue-green zero-downtime routing.
# ==============================================================================

# Blue-Green Upstream Definitions
upstream api_blue {
    server unix:/run/fluxpay/api-1.sock;
    keepalive 32;
}

upstream api_green {
    server unix:/run/fluxpay/api-2.sock;
    keepalive 32;
}

# HTTP to HTTPS Strict Redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS Ingress
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS Configuration (TLS 1.3 only, modern institutional crypto standard)
    ssl_certificate /etc/ssl/fluxpay/fullchain.pem;
    ssl_certificate_key /etc/ssl/fluxpay/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Mandatory Security Headers (Platform Defense-in-Depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Ingress body limit: 1m (>> 64KiB application layer limit; provides header+protocol margin)
    # The application layer (Task 21 gateway pipeline) strictly enforces 64KiB max body bytes.
    client_max_body_size 1m;

    # Static assets served directly from filesystem without Python overhead
    location /static/ {
        alias /opt/fluxpay/current/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check probe (bypasses access log noise, routes to active instance)
    location = /healthz {
        access_log off;
        include /etc/nginx/fluxpay-active.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
        proxy_next_upstream off;
    }

    # Primary API & Dashboard routing
    location / {
        include /etc/nginx/fluxpay-active.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Drain triangle: proxy_read_timeout (65s) > Gunicorn timeout (60s) > graceful (30s)
        proxy_read_timeout 65s;

        # CRITICAL IDEMPOTENCY SAFETY:
        # Never retry upstream requests on failure. Automatic HTTP retries on timeouts
        # cause duplicate payment executions and violate payment idempotency guarantees.
        # Retries must only happen via client SDK using distinct idempotency keys.
        proxy_next_upstream off;
    }
}
