apiVersion: v1
kind: Service
metadata:
  name: fluxpay-api-service
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: fluxpay
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fluxpay
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 9110
      targetPort: 9110
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fluxpay-ingress
  namespace: fluxpay
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "65"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - api.fluxpay.io
        - console.fluxpay.io
      secretName: fluxpay-tls-cert
  rules:
    - host: api.fluxpay.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fluxpay-api-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fluxpay-api-hpa
  namespace: fluxpay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fluxpay-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fluxpay-api-pdb
  namespace: fluxpay
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxpay
      app.kubernetes.io/component: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluxpay-network-policy
  namespace: fluxpay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluxpay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9110
  egress:
    - {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fluxpay-servicemonitor
  namespace: fluxpay
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxpay
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
