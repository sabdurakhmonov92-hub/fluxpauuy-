apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-api
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: fluxpay
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxpay
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxpay
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9110"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: fluxpay-api
          image: ghcr.io/fluxpay/fluxpay:latest
          imagePullPolicy: IfNotPresent
          args: ["python", "run_fluxpay.py", "--host", "0.0.0.0", "--port", "8000", "--no-browser"]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9110
          envFrom:
            - configMapRef:
                name: fluxpay-config
            - secretRef:
                name: fluxpay-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxpay-worker
  namespace: fluxpay
  labels:
    app.kubernetes.io/name: fluxpay
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fluxpay
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluxpay
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: ghcr.io/fluxpay/fluxpay:latest
          args: ["python", "-m", "fluxpay.workers.blockchain_reconciliation"]
          envFrom:
            - configMapRef:
                name: fluxpay-config
            - secretRef:
                name: fluxpay-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
