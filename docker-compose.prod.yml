# ==============================================================================
# FluxPay Production Docker Compose Stack (Part 4.2)
# ==============================================================================
name: fluxpay-prod

services:
  fluxpay-api:
    image: fluxpay-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fluxpay-net
      - proxy-net

  fluxpay-worker:
    image: fluxpay-api:latest
    restart: always
    entrypoint: ["python", "-m", "fluxpay.workers.blockchain_reconciliation"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fluxpay-net

  fluxpay-webhook-worker:
    image: fluxpay-api:latest
    restart: always
    entrypoint: ["python", "-m", "fluxpay.workers.webhook_entrypoints", "delivery"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fluxpay-net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=fluxpay_prod_app
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
      - POSTGRES_DB=fluxpay_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxpay_prod_app -d fluxpay_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxpay-net

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ChangeMeProdPass!}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ChangeMeProdPass!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fluxpay-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=fluxpay_prod
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-ChangeMeRabbitPass!}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fluxpay-net

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: always
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - fluxpay-net

  grafana:
    image: grafana/grafana:10.4.0
    restart: always
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/observability/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - fluxpay-net
      - proxy-net

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/fluxpay.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - fluxpay-api
    networks:
      - proxy-net

networks:
  fluxpay-net:
    internal: true
  proxy-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  grafanadata:
